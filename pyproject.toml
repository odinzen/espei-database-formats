[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "espei-dat"
version = "0.1.0"
description = "Fit parameters of ChemSage DAT, TDB and XTDB databases with ESPEI"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Michael E. Bustamante"}]
dependencies = ["pycalphad>=0.11", "espei>=0.9", "pyyaml"]

[project.optional-dependencies]
xtdb = ["pycalphad-xtdb"]
test = ["pytest"]

[project.scripts]
espei-dat = "espei_dat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
